services:
  dashy:
    image: lissy93/dashy:latest
    container_name: dashy
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-7575}:8080"
    environment:
      TZ: ${TZ:-Asia/Dhaka}
    volumes:
      - ${SSD_DATA_DIR:-/home/maruf/homelab/volumes}/dashy/conf.yml:/app/user-data/conf.yml
    networks:
      - homelab

  it-tools:
    image: corentinth/it-tools:latest
    container_name: it-tools
    restart: unless-stopped
    ports:
      - "${IT_TOOLS_PORT:-8091}:80"
    networks:
      - homelab

networks:
  homelab:
    external: true
