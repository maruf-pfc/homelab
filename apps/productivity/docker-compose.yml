services:
  leantime-db:
    image: mariadb:11
    container_name: leantime-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${LEANTIME_DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${LEANTIME_DB_NAME:-leantime}
      MYSQL_USER: ${LEANTIME_DB_USER:-leantime}
      MYSQL_PASSWORD: ${LEANTIME_DB_PASSWORD:-leantimepassword}
    volumes:
      - ${SSD_DATA_DIR:-/home/maruf/homelab/volumes}/leantime/mysql:/var/lib/mysql
    networks:
      - homelab

  leantime:
    image: leantime/leantime:latest
    container_name: leantime
    restart: unless-stopped
    depends_on:
      - leantime-db
    ports:
      - "${LEANTIME_PORT:-8090}:8080"
    environment:
      LEAN_DB_HOST: leantime-db
      LEAN_DB_DATABASE: ${LEANTIME_DB_NAME:-leantime}
      LEAN_DB_USER: ${LEANTIME_DB_USER:-leantime}
      LEAN_DB_PASSWORD: ${LEANTIME_DB_PASSWORD:-leantimepassword}
    volumes:
      - ${SSD_DATA_DIR:-/home/maruf/homelab/volumes}/leantime/config:/var/www/html/userfiles
    networks:
      - homelab

  stirling-pdf:
    image: frooodle/s-pdf:latest
    container_name: stirling-pdf
    restart: unless-stopped
    ports:
      - "${STIRLING_PDF_PORT:-8084}:8080"
    environment:
      SYSTEM_DEFAULT_LOCALE: "en_US"
    networks:
      - homelab

  memos:
    image: neosmemo/memos:latest
    container_name: memos
    restart: unless-stopped
    ports:
      - "${MEMOS_PORT:-5230}:5230"
    volumes:
      - ${SSD_DATA_DIR:-/home/maruf/homelab/volumes}/memos:/var/opt/memos
    networks:
      - homelab

  changedetection:
    image: dgtlmoon/changedetection.io:latest
    container_name: changedetection
    restart: unless-stopped
    ports:
      - "${CHANGEDETECTION_PORT:-5001}:5000"
    volumes:
      - ${SSD_DATA_DIR:-/home/maruf/homelab/volumes}/changedetection:/datastore
    networks:
      - homelab

  vikunja:
    image: vikunja/vikunja:latest
    container_name: vikunja
    restart: unless-stopped
    ports:
      - "${VIKUNJA_PORT:-3456}:3456"
    environment:
      VIKUNJA_SERVICE_JWTSECRET: "change_me_vikunja_jwt_secret_key"
    volumes:
      - ${SSD_DATA_DIR:-/home/maruf/homelab/volumes}/vikunja:/app/vikunja/files
    networks:
      - homelab

networks:
  homelab:
    external: true
