services:
  dashy:
    image: lissy93/dashy:latest
    container_name: dashy
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-7575}:8080"
    volumes:
      - ${SSD_DATA_DIR:-/home/maruf/homelab/volumes}/dashy/conf.yml:/app/user-data/conf.yml
    networks:
      - homelab

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "${HOMEPAGE_PORT:-3000}:3000"
    volumes:
      - ${SSD_DATA_DIR:-/home/maruf/homelab/volumes}/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homelab

  glance:
    image: glanceapp/glance:latest
    container_name: glance
    restart: unless-stopped
    ports:
      - "${GLANCE_PORT:-8080}:8080"
    volumes:
      - ${SSD_DATA_DIR:-/home/maruf/homelab/volumes}/glance/glance.yml:/app/glance.yml
    networks:
      - homelab

networks:
  homelab:
    external: true
