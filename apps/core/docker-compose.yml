services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "${NPM_HTTP_PORT:-80}:80"
      - "${NPM_HTTPS_PORT:-443}:443"
      - "${NPM_ADMIN_PORT:-8081}:81"
    environment:
      TZ: ${TZ:-Asia/Dhaka}
    volumes:
      - ${HDD_DATA_DIR:-/home/maruf/MyHDDStorage}/docker/volumes/nginx-proxy-manager/data:/data
      - ${HDD_DATA_DIR:-/home/maruf/MyHDDStorage}/docker/volumes/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
    networks:
      - homelab

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    ports:
      - "${PORTAINER_TUNNEL_PORT:-8000}:8000"
      - "${PORTAINER_HTTP_PORT:-9000}:9000"
      - "${PORTAINER_HTTPS_PORT:-9443}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HDD_DATA_DIR:-/home/maruf/MyHDDStorage}/docker/volumes/portainer:/data
    networks:
      - homelab

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - ${HDD_DATA_DIR:-/home/maruf/MyHDDStorage}/docker/volumes/uptime-kuma:/app/data
    networks:
      - homelab


networks:
  homelab:
    external: true
